name = "cloudflare"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 部署前自动编译前端。Cloudflare Direct Git 部署环境只安装根目录依赖，
# 前端依赖需在此自包含安装，否则 vite 找不到（sh: 1: vite: not found）
[build]
command = "cd frontend && npm install && npm run build"

# 静态资源配置 - 服务 Vue 前端
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 仅 /api/* 优先经过 Worker；其余静态资源/SPA 路由直接由 Assets 处理，不触发 Worker
run_worker_first = ["/api/*"]

# D1 数据库绑定
[[d1_databases]]
binding = "suyuan"
database_name = "suyuank"
database_id = "85ea2866-719e-4fea-a0a1-50737c931724"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "suyuankv"
id = "e9a8ddb59a4f46088c440e1cc43ad856"

# AI 绑定 (Workers AI - 用于生成文章摘要)
[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
RESEND_FROM = "noreply@suyuank.top"

[triggers]
crons = ["0 */4 * * *", "*/30 * * * *"]

